services:
  web:
    build:
      context: .
      args:
        # Build-time only (inlined into the client bundle / read by next.config.ts).
        MEYDAN_API_BASE_URL: ${MEYDAN_API_BASE_URL}
        NEXT_PUBLIC_MEYDAN_API_BASE_URL: ${NEXT_PUBLIC_MEYDAN_API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-only; safe to change here without a rebuild since the app
      # reads these per request. Keep the API base in sync with the build
      # args above (same backend, read again at runtime).
      MEYDAN_API_BASE_URL: ${MEYDAN_API_BASE_URL}
      NEXT_PUBLIC_MEYDAN_API_BASE_URL: ${NEXT_PUBLIC_MEYDAN_API_BASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      MEYDAN_MEDIA_ALLOWED_ORIGINS: ${MEYDAN_MEDIA_ALLOWED_ORIGINS:-}
