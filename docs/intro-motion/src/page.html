<title>موشن معرفی نقش من</title>
<style>
{{FONTS}}
/* layout: one cinema stage, a scrub bar under it, chapters as a strip of jump buttons */
:root {
  --bg: #07080b; --panel: #0f1116; --line: rgba(255,255,255,0.09); --ink: #f3f1ec; --mute: #9a9ba3;
  --gold: #f2c46d; --red: #dc2626; --f: 'Vazirmatn', Tahoma, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
[hidden] { display: none !important; }
body { font-family: var(--f); padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tile { width: 44px; height: 44px; border-radius: 10px; background: var(--red); display: grid; place-items: center; flex: none; }
.tile svg { width: 64%; height: 64%; }
h1 { font-size: 20px; font-weight: 900; margin: 0; line-height: 1.3; }
.sub { color: var(--gold); font-size: 14px; margin: 2px 0 0; }
.meta { color: var(--mute); font-size: 13px; }
.stage { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; max-width: 100%; box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,0.5); }
.stage:fullscreen { border-radius: 0; display: grid; place-items: center; }
canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
.stage:fullscreen canvas { width: auto; height: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
.big { position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(10,10,14,0.55); backdrop-filter: blur(6px); display: grid; place-items: center; cursor: pointer; color: #fff; }
.big:hover { background: rgba(220,38,38,0.85); }
.controls { display: flex; align-items: center; gap: 10px; direction: ltr; }
.ctl { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.ctl:hover { border-color: var(--gold); color: var(--gold); }
button:focus-visible, .bar:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.bar { position: relative; flex: 1; min-width: 0; height: 32px; cursor: pointer; touch-action: none; }
.track { position: absolute; left: 0; right: 0; top: 14px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, #c8902f, var(--gold)); }
.tick { position: absolute; top: 10px; width: 2px; height: 12px; margin-left: -1px; background: rgba(255,255,255,0.35); border-radius: 1px; pointer-events: none; }
.time { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 13px; min-width: 84px; text-align: right; flex: none; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.chapters button { width: 100%; height: 100%; text-align: right; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); padding: 10px 12px; font: inherit; cursor: pointer; display: grid; gap: 2px; align-content: start; }
.chapters button:hover { border-color: rgba(242,196,109,0.5); }
.chapters button.on { border-color: var(--gold); background: rgba(242,196,109,0.08); }
.chapters .tm { color: var(--gold); font-size: 12px; font-variant-numeric: tabular-nums; }
.chapters .nm { font-size: 14px; font-weight: 700; line-height: 1.5; }
@media (max-width: 900px) { .chapters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .chapters li:last-child { grid-column: 1 / -1; } }
</style>
<div class="wrap" dir="rtl">
  <header>
    <div class="brand">
      <span class="tile" aria-hidden="true">{{LOGO_SVG}}</span>
      <div><h1>نقش من</h1><p class="sub">یک نقشه، هزاران نقش</p></div>
    </div>
    <span class="meta" id="meta">موشن معرفی · ۱۹۲۰×۱۰۸۰</span>
  </header>
  <div class="stage">
    <canvas id="stage" width="1920" height="1080" role="img" aria-label="موشن معرفی نقش من"></canvas>
    <button class="big" id="big" type="button" aria-label="پخش" hidden><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></button>
  </div>
  <div class="controls">
    <button class="ctl" id="play" type="button" aria-label="پخش"><svg class="i-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg><svg class="i-pause" hidden width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
    <button class="ctl" id="restart" type="button" aria-label="پخش از ابتدا"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <div class="bar" id="bar" tabindex="0" role="slider" aria-label="زمان" aria-valuemin="0" aria-valuemax="75"><div class="track"><div class="fill" id="fill"></div></div></div>
    <span class="time" id="time">۰:۰۰ / ۱:۱۵</span>
    <button class="ctl" id="fs" type="button" aria-label="تمام‌صفحه"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
  <ol class="chapters" id="chapters"></ol>
</div>
<script type="application/json" id="geo-data">{{GEO}}</script>
<script type="text/plain" id="logo-d">{{LOGO_D}}</script>
<script type="text/plain" id="flag-svg">{{FLAG_B64}}</script>
