name: Signup Flow CI

on:
  push:
    paths:
      - "app/auth/**"
      - "app/api/auth/**"
      - "app/api/meydan/**"
      - "features/auth/**"
      - "features/profile/components/LocationPickerMap.tsx"
      - "lib/meydan-session.ts"
      - "lib/meydan-session-config.ts"
      - "tests/registration.test.mjs"
      - "tests/session-cookie.test.mjs"
      - "tests/map-theme.test.mjs"
      - "package.json"
      - ".github/workflows/signup-flow-ci.yml"
  pull_request:
    paths:
      - "app/auth/**"
      - "app/api/auth/**"
      - "app/api/meydan/**"
      - "features/auth/**"
      - "features/profile/components/LocationPickerMap.tsx"
      - "lib/meydan-session.ts"
      - "lib/meydan-session-config.ts"
      - "tests/registration.test.mjs"
      - "tests/session-cookie.test.mjs"
      - "tests/map-theme.test.mjs"
      - "package.json"
      - ".github/workflows/signup-flow-ci.yml"

permissions:
  contents: read

jobs:
  verify-signup-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Registration behavior tests
        run: npm run test:registration
      - name: Session cookie tests
        run: npm run test:session
      - name: Existing map tests
        run: npm run test:map
      - name: Lint changed signup/session files
        run: npx eslint app/auth/page.tsx 'app/api/auth/[action]/route.ts' 'app/api/meydan/[...path]/route.ts' features/auth lib/meydan-session.ts lib/meydan-session-config.ts
      - name: Build frontend
        run: npm run build
