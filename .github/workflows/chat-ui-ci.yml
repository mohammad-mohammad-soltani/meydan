name: Chat UI CI

on:
  pull_request:
    paths:
      - "features/chat/**"
      - "tests/chat-utils.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chat-ui-ci.yml"

permissions:
  contents: read

jobs:
  verify-chat-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run chat behavior tests
        run: node --experimental-strip-types --test tests/chat-utils.test.mjs
      - name: Build frontend
        run: npm run build
