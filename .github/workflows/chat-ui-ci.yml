name: Chat UI CI

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "features/chat/**"
      - "features/feed/**"
      - "features/posts/**"
      - "features/profile/**"
      - "features/podcasts/**"
      - "lib/**"
      - "tests/chat-utils.test.mjs"
      - "tests/chat-message-menu.test.mjs"
      - "tests/podcasts-search.test.mjs"
      - "tests/auth-gate-theme.test.mjs"
      - "tests/realtime-soketi.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chat-ui-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "features/chat/**"
      - "features/feed/**"
      - "features/posts/**"
      - "features/profile/**"
      - "features/podcasts/**"
      - "lib/**"
      - "tests/chat-utils.test.mjs"
      - "tests/chat-message-menu.test.mjs"
      - "tests/podcasts-search.test.mjs"
      - "tests/auth-gate-theme.test.mjs"
      - "tests/realtime-soketi.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chat-ui-ci.yml"

permissions:
  contents: read

jobs:
  verify-chat-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run chat behavior tests
        run: node --experimental-strip-types --test tests/chat-utils.test.mjs tests/chat-message-menu.test.mjs
      - name: Run podcasts behavior tests
        run: node --experimental-strip-types --test tests/podcasts-search.test.mjs
      - name: Run auth gate and theme tests
        run: node --experimental-strip-types --test tests/auth-gate-theme.test.mjs
      - name: Run realtime transport tests
        run: node --experimental-strip-types --test tests/realtime-soketi.test.mjs
      - name: Build frontend
        run: npm run build
