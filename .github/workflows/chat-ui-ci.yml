name: Chat UI CI

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "features/chat/**"
      - "features/feed/**"
      - "features/posts/**"
      - "features/profile/**"
      - "features/podcasts/**"
      - "lib/**"
      - "proxy.ts"
      - "tests/chat-utils.test.mjs"
      - "tests/chat-message-menu.test.mjs"
      - "tests/notification-icons.test.mjs"
      - "tests/podcasts-search.test.mjs"
      - "tests/auth-gate-theme.test.mjs"
      - "tests/protected-routes.test.mjs"
      - "tests/video-playback-behaviour.test.mjs"
      - "tests/video-autoplay-chain.test.mjs"
      - "tests/read-more.test.mjs"
      - "tests/pwa-worker.test.mjs"
      - "features/media/**"
      - "tests/realtime-soketi.test.mjs"
      - "app/(app)/admin/**"
      - "features/admin/**"
      - "tests/admin-normalize.test.mjs"
      - "tests/admin-api-contract.test.mjs"
      - "tests/admin-panel-gate.test.mjs"
      - "tests/admin-user-deletion.test.mjs"
      - "tests/public-profile-routes.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chat-ui-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "features/chat/**"
      - "features/feed/**"
      - "features/posts/**"
      - "features/profile/**"
      - "features/podcasts/**"
      - "lib/**"
      - "proxy.ts"
      - "tests/chat-utils.test.mjs"
      - "tests/chat-message-menu.test.mjs"
      - "tests/notification-icons.test.mjs"
      - "tests/podcasts-search.test.mjs"
      - "tests/auth-gate-theme.test.mjs"
      - "tests/protected-routes.test.mjs"
      - "tests/video-playback-behaviour.test.mjs"
      - "tests/video-autoplay-chain.test.mjs"
      - "tests/read-more.test.mjs"
      - "tests/pwa-worker.test.mjs"
      - "features/media/**"
      - "tests/realtime-soketi.test.mjs"
      - "app/(app)/admin/**"
      - "features/admin/**"
      - "tests/admin-normalize.test.mjs"
      - "tests/admin-api-contract.test.mjs"
      - "tests/admin-panel-gate.test.mjs"
      - "tests/admin-user-deletion.test.mjs"
      - "tests/public-profile-routes.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chat-ui-ci.yml"

permissions:
  contents: read

jobs:
  verify-chat-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run chat behavior tests
        run: node --experimental-strip-types --test tests/chat-utils.test.mjs tests/chat-message-menu.test.mjs tests/notification-icons.test.mjs
      - name: Run podcasts behavior tests
        run: node --experimental-strip-types --test tests/podcasts-search.test.mjs
      - name: Run auth gate and theme tests
        run: node --experimental-strip-types --test tests/auth-gate-theme.test.mjs
      - name: Run protected route tests
        run: node --experimental-strip-types --test tests/protected-routes.test.mjs
      - name: Run video playback behavior tests
        run: node --experimental-strip-types --test tests/video-playback-behaviour.test.mjs
      - name: Run video autoplay chain tests
        run: node --experimental-strip-types --test tests/video-autoplay-chain.test.mjs
      - name: Run PWA browser worker tests
        run: node --experimental-strip-types --test tests/pwa-worker.test.mjs
      - name: Run read more tests
        run: node --experimental-strip-types --test tests/read-more.test.mjs
      - name: Run media player tests
        run: node --experimental-strip-types --test tests/media-players.test.mjs
      - name: Run realtime transport tests
        run: node --experimental-strip-types --test tests/realtime-soketi.test.mjs
      - name: Run admin payload normalizer tests
        run: node --experimental-strip-types --test tests/admin-normalize.test.mjs
      - name: Run admin API contract tests
        run: node --experimental-strip-types --test tests/admin-api-contract.test.mjs
      - name: Run admin panel gate tests
        run: node --experimental-strip-types --test tests/admin-panel-gate.test.mjs
      - name: Run admin user deletion tests
        run: node --experimental-strip-types --test tests/admin-user-deletion.test.mjs
      - name: Run public profile route tests
        run: node --experimental-strip-types --test tests/public-profile-routes.test.mjs
      - name: Build frontend
        run: npm run build
